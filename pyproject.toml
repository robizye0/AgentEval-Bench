[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "agenteval-bench"
version = "0.1.0"
description = "Deterministic evaluation harness for agent tool-calling workflows"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AgentEval-Bench contributors" }]
dependencies = ["pydantic>=2.7,<3", "typer>=0.12", "PyYAML>=6", "fastapi>=0.110", "uvicorn>=0.29"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]
telemetry = ["opentelemetry-api>=1.25", "opentelemetry-sdk>=1.25", "opentelemetry-exporter-otlp>=1.25", "langfuse>=2.40"]

[project.scripts]
agenteval = "agenteval.cli:app"

[project.entry-points.pytest11]
agenteval = "agenteval.integration.pytest_plugin"

[tool.hatch.build.targets.wheel]
packages = ["agenteval"]
include = ["agenteval/templates/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
